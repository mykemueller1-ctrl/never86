name: CI

on:
  push:
    branches: [recovery-apr12]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      RESEND_API_KEY: re_ci_placeholder
      CRON_SECRET: ci-secret
      OWNER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
