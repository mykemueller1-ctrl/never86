<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Action Shift — owner seat · Never 86'd</title>
    <meta name="description" content="One chat. One prompt. Menu and Schedules. Floor books spawn from those. Sample shop only." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f7f4ec;
        --ink: #1a1712;
        --muted: #6a6458;
        --line: #e4dcc8;
        --rail: #ebe6d8;
        --bubble: #fffdf8;
        --mine: #1c1914;
        --go: #1d4ed8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Source Sans 3", system-ui, sans-serif; }
      .app { height: 100vh; display: grid; grid-template-columns: 248px 1fr; }
      @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .rail { display: none; } .rail.open { display: block; } }
      .rail { background: var(--rail); border-right: 1px solid var(--line); padding: 16px 12px 24px; overflow: auto; }
      .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; }
      .mark { width: 22px; height: 22px; border-radius: 6px; background: #1e40af; color: #f6f3ec; font: 700 11px/22px "IBM Plex Mono", monospace; text-align: center; }
      .new { width: 100%; border: 1px solid var(--line); background: #fffdf8; border-radius: 10px; padding: 8px 10px; font: 600 13px inherit; cursor: pointer; text-align: left; margin-bottom: 16px; }
      .sec { font: 600 10px/1 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
      .nav { width: 100%; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; font: 600 14px inherit; color: inherit; text-align: left; cursor: pointer; }
      .nav:hover, .nav.on { background: #fffdf8; }
      .nav small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 1px; }
      .roles { padding: 0 0 4px 12px; }
      .nav.dim { color: var(--muted); font-weight: 500; }
      .stage { display: grid; grid-template-rows: 1fr auto; min-width: 0; }
      .thread { overflow: auto; padding: 28px 20px 28px; min-height: 0; }
      .empty { max-width: 560px; margin: 12vh auto 0; text-align: center; }
      .empty h1 { font-weight: 600; font-size: clamp(26px, 4vw, 36px); margin: 0 0 8px; letter-spacing: -0.03em; }
      .empty p { color: var(--muted); margin: 0; }
      .msg { max-width: 680px; margin: 0 auto 14px; }
      .msg .who { font: 600 11px/1 "IBM Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
      .msg .body { background: var(--bubble); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; line-height: 1.45; }
      .msg.me .body { background: var(--mine); color: #f6f3ec; border-color: var(--mine); }
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
      .card { border: 1px solid var(--line); background: #f7f3e8; border-radius: 12px; padding: 10px; text-align: left; cursor: pointer; font: inherit; }
      .card b { display: block; font-size: 14px; }
      .card span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
      .dock { padding: 8px 16px 18px; }
      .box { max-width: 680px; margin: 0 auto; background: #fffdf8; border: 1px solid var(--line); border-radius: 22px; padding: 10px 12px 8px; }
      .box.hot { border-color: var(--go); }
      textarea { width: 100%; border: 0; resize: none; min-height: 44px; max-height: 140px; font: inherit; outline: none; background: transparent; }
      .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .bar span { font-size: 11px; color: var(--muted); }
      .send, label.file { border: 0; background: var(--mine); color: #f6f3ec; border-radius: 999px; padding: 7px 14px; font: 700 13px inherit; cursor: pointer; }
      .follows { max-width: 680px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 8px; }
      .follows button { border: 1px solid var(--line); background: #fffdf8; border-radius: 999px; padding: 6px 12px; font: 600 13px inherit; cursor: pointer; }
      .fine { max-width: 680px; margin: 6px auto 0; font-size: 11px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <div class="mark">A</div>
          <div><strong>Action Shift</strong><br /><span style="color:var(--muted);font-size:12px">Owner seat · free</span></div>
        </div>
        <button class="new" type="button" data-room="home">New chat</button>
        <p class="sec">The shop</p>
        <button class="nav" type="button" data-room="menu">Menu<small>What you charge. What’s in it.</small></button>
        <button class="nav" type="button" data-room="schedules">Schedules<small>Labor lives here. Posted in / posted out.</small></button>
        <div class="roles">
          <button class="nav dim" type="button" data-room="cards">Labor cards</button>
          <button class="nav dim" type="button" data-room="report">Labor report</button>
        </div>
        <p class="sec">Floor book</p>
        <div class="roles">
          <button class="nav dim" type="button" data-room="recipes">Recipes<small>What’s in the plate. Not a food cost.</small></button>
          <button class="nav dim" type="button" data-room="kitchen">Kitchen notes<small>Line. 86 board. Labels.</small></button>
          <button class="nav dim" type="button" data-room="dining">Dining room<small>Server open, shift, close.</small></button>
          <button class="nav dim" type="button" data-room="driver">Driver notes<small>Bag, hot and cold, receipt.</small></button>
          <button class="nav dim" type="button" data-room="notes">Employee notes<small>One line the shift can read.</small></button>
        </div>
        <p class="sec">Later</p>
        <button class="nav dim" type="button" data-room="guides">Order guides</button>
        <button class="nav dim" type="button" data-room="invoices">Invoices</button>
      </aside>
      <main class="stage">
        <div class="thread" id="thread"></div>
        <div class="dock">
          <div class="follows" id="follows"></div>
          <div class="box" id="box">
            <textarea id="prompt" rows="2" placeholder="Drop last night’s close, or pick Menu / Schedules."></textarea>
            <div class="bar">
              <span id="hint">One box. Like ChatGPT. We read it.</span>
              <div>
                <label class="file">File<input id="file" type="file" accept=".txt,.csv,.pdf,.png,.jpg" hidden /></label>
                <button class="send" type="button" id="send">Send</button>
              </div>
            </div>
          </div>
          <p class="fine">Sample shop — not yours, not Bamba. We don’t invent food cost, labor $, or late hours. Invoice ≠ COGS. Punch ≠ schedule.</p>
        </div>
      </main>
    </div>
    <script>
      const POSITIONS = {
        foh: { title: "Front of house", posted: "Posted in / posted out · sample seat. Punch Missing." },
        boh: { title: "Back of house", posted: "Posted in / posted out · sample seat. Punch Missing." },
        delivery: { title: "Delivery", posted: "Posted in / posted out · sample seat. Punch Missing." },
        dishwasher: { title: "Dishwasher", posted: "Posted in / posted out · sample seat. Punch Missing." },
      };

      const STARTERS = {
        home: null,
        menu: "What’s on the menu and what do you charge? Plate + price. The recipe card opens after that. Yield stays Missing. Not a food-cost %.",
        schedules: "Schedules are the thing you already write. Labor lives on that grid — who you posted, when they were supposed to walk in, when they were supposed to walk out. Drop the week. Then we spawn labor cards and a labor report. We do not write the week yet. No invented hours.",
        recipes: "Recipes sit on the plate you already priced. Sample: smash burger — bun, smash patty, cheese. Price stays on the menu. Yield is Missing. Not a food-cost %.",
        kitchen: "Kitchen notes sit on the line. Open: station set, temps logged, 86 board. Mid: fire times. Close: walk-in labels. Sample only. We don’t invent a count.",
        dining: "Dining-room checklist for the floor. Open: sidework, silver, water, specials board. Shift: greet, 86 call, allergy ask. Close: reset. No drawer totals. Sample shop.",
        driver: "Driver notes for the run. Bag check, hot and cold split, bring the receipt back. No guest address on this sample.",
        notes: "Employee note is one line the shift can read. Sample: line is short one sauté. Not a write-up. No names.",
        cards: "Labor cards spawn from the schedule. Drop the week first if it’s empty. Each card is a seat: posted in, posted out. Late drift only if the punch exists. Punch ≠ schedule. We don’t invent stay-late hours.",
        report: "Labor report spawns from the same schedule. How many people in each seat is how this shop actually runs — tribal knowledge, not a textbook. Late / stay-late stays Missing until punches land.",
        foh: "Front of house on the schedule. Posted in / posted out. Punch Missing — we will not say they stayed late.",
        boh: "Back of house on the schedule. Posted in / posted out. Punch Missing.",
        delivery: "Delivery on the schedule. Posted in / posted out. Punch Missing.",
        dishwasher: "Dish on the schedule. Posted in / posted out. Punch Missing.",
        guides: "Order guides come after the menu. What’s on the plate, then what you buy. Placeholder for now.",
        invoices: "Invoice later unlocks SKU drift: beef went up, switch the house or raise the plate. Invoice ≠ COGS. Don’t drop one until the menu is in.",
      };

      const PLACE = {
        home: "Drop last night’s close, or pick Menu / Schedules.",
        menu: "Burger $14. Cheese, bun, smash patty…",
        schedules: "Mon–Sun, who you already posted, in and out…",
        recipes: "Bun, smash patty, cheese… yield stays Missing.",
        kitchen: "86 board, temps, fire times…",
        dining: "Sidework, specials, allergy ask…",
        driver: "Bag check, hot and cold…",
        notes: "One line the shift needs…",
        cards: "A station from the schedule…",
        report: "How many on the floor, the line, dish…",
        foh: "Floor posted…",
        boh: "Line posted…",
        delivery: "Drivers posted…",
        dishwasher: "Dish posted…",
        guides: "Order guide later. Menu first.",
        invoices: "Invoice later. Menu first.",
      };

      let room = "home";
      const threads = { home: [] };
      const known = { close: false, menu: false, schedule: false, punches: false };

      function threadOf(id) {
        if (!threads[id]) threads[id] = [];
        return threads[id];
      }

      function add(id, who, html, extra) {
        threadOf(id).push({ who, html, extra: extra || "" });
      }

      function spawnAgents() {
        return `<div class="cards">
          <button class="card" type="button" data-room="cards"><b>Labor cards</b><span>Each posted shift: station, in, out.</span></button>
          <button class="card" type="button" data-room="report"><b>Labor report</b><span>Headcount by seat. That’s how this shop runs.</span></button>
        </div>`;
      }

      function positionCards() {
        return `<div class="cards">
          <button class="card" type="button" data-room="foh"><b>Front of house</b><span>${POSITIONS.foh.posted}</span></button>
          <button class="card" type="button" data-room="boh"><b>Back of house</b><span>${POSITIONS.boh.posted}</span></button>
          <button class="card" type="button" data-room="delivery"><b>Delivery</b><span>${POSITIONS.delivery.posted}</span></button>
          <button class="card" type="button" data-room="dishwasher"><b>Dishwasher</b><span>${POSITIONS.dishwasher.posted}</span></button>
        </div>`;
      }

      function bookCard(id, title, span) {
        return `<div class="cards"><button class="card" type="button" data-room="${id}"><b>${title}</b><span>${span}</span></button></div>`;
      }

      function extraFor(id) {
        if (id === "schedules") {
          const note = known.schedule
            ? bookCard("notes", "Employee notes", "One line the shift can read. No names.")
            : "";
          return spawnAgents() + note;
        }
        if (id === "cards") return known.schedule ? positionCards() : "";
        if (id === "menu" && known.menu) {
          return bookCard("recipes", "Recipes", "What’s in the plate. Yield Missing. Not a food cost.");
        }
        if (id === "foh") return bookCard("dining", "Dining room", "Server open, shift, close. No drawer totals.");
        if (id === "boh") return bookCard("kitchen", "Kitchen notes", "86 board, temps, labels. No count.");
        if (id === "delivery") return bookCard("driver", "Driver notes", "Bag check. No guest address.");
        return "";
      }

      function followsFor() {
        if (room === "recipes") return [["menu", "Menu"], ["schedules", "Schedules"]];
        if (room === "kitchen") return [["boh", "Back of house"], ["notes", "Employee notes"]];
        if (room === "dining") return [["foh", "Front of house"], ["notes", "Employee notes"]];
        if (room === "driver") return [["delivery", "Delivery"], ["notes", "Employee notes"]];
        if (room === "notes") return [["cards", "Labor cards"], ["home", "Last night’s close"]];
        if (room === "foh") return [["dining", "Dining room"], ["cards", "Labor cards"]];
        if (room === "boh") return [["kitchen", "Kitchen notes"], ["cards", "Labor cards"]];
        if (room === "delivery") return [["driver", "Driver notes"], ["cards", "Labor cards"]];
        if (room === "schedules" || known.schedule) {
          if (room === "schedules") return [["cards", "Labor cards"], ["report", "Labor report"]];
        }
        if (room === "cards") return [["report", "Labor report"], ["foh", "Front of house"]];
        if (room === "report") return [["cards", "Labor cards"], ["home", "Last night’s close"]];
        if (known.close && !known.schedule) return [["schedules", "Drop the schedule"], ["menu", "What’s on the menu?"]];
        if (known.menu && !known.close && room !== "menu") return [["home", "Drop last night’s close"], ["schedules", "Schedules"]];
        if (room === "menu") {
          return known.menu
            ? [["recipes", "Recipes"], ["schedules", "Schedules"]]
            : [["schedules", "Schedules"], ["home", "Last night’s close"]];
        }
        return [["menu", "Menu"], ["schedules", "Schedules"]];
      }

      function render() {
        document.querySelectorAll(".nav").forEach((el) => {
          el.classList.toggle("on", el.dataset.room === room);
          if (el.dataset.room === "cards" || el.dataset.room === "report") {
            el.classList.toggle("dim", !known.schedule && room !== el.dataset.room);
          }
          if (el.dataset.room === "recipes") {
            el.classList.toggle("dim", !known.menu && room !== "recipes");
          }
          if (["kitchen", "dining", "driver", "notes"].includes(el.dataset.room)) {
            el.classList.toggle("dim", !known.schedule && room !== el.dataset.room);
          }
        });
        const list = threadOf(room);
        const el = document.getElementById("thread");
        const prompt = document.getElementById("prompt");
        prompt.placeholder = PLACE[room] || PLACE.home;
        const chips = document.getElementById("follows");
        chips.innerHTML = "";
        if (!list.length && room === "home") {
          el.innerHTML = `<div class="empty"><h1>What happened last night?</h1><p>One chat. Menu or Schedules — things you already run. Labor comes off the schedule.</p></div>`;
          followsFor().forEach(([id, label]) => {
            const b = document.createElement("button");
            b.type = "button";
            b.dataset.room = id;
            b.textContent = label;
            chips.appendChild(b);
          });
          return;
        }
        el.innerHTML = list
          .map(
            (m) =>
              `<div class="msg ${m.who}"><div class="who">${m.who === "me" ? "You" : "Action Shift"}</div><div class="body">${m.html}${m.extra || ""}</div></div>`
          )
          .join("");
        followsFor().forEach(([id, label]) => {
          const b = document.createElement("button");
          b.type = "button";
          b.dataset.room = id;
          b.textContent = label;
          chips.appendChild(b);
        });
        requestAnimationFrame(() => {
          const last = el.querySelector(".msg:last-child");
          if (last) last.scrollIntoView({ block: "nearest", behavior: "auto" });
        });
      }

      function starterFor(id) {
        if (id === "recipes" && !known.menu) {
          return "Menu first. Drop the plate and the price, then the recipe card. Sample when it’s in: smash burger — bun, smash patty, cheese. Yield stays Missing. Not a food-cost %.";
        }
        if (id === "kitchen" && !known.schedule) {
          return "Schedule first. Kitchen notes sit on the back-of-house seat. Drop the week, then the line. No count invented.";
        }
        if (id === "dining" && !known.schedule) {
          return "Schedule first. The dining-room checklist sits on the front-of-house seat. Drop the week, then the floor. No drawer totals.";
        }
        if (id === "driver" && !known.schedule) {
          return "Schedule first. Driver notes sit on the delivery seat. Drop the week, then the run. No guest address.";
        }
        if (id === "notes" && !known.schedule) {
          return "Schedule first. The employee note is one line for the shift that’s posted. Not a write-up. No names.";
        }
        return STARTERS[id];
      }

      function openRoom(id) {
        room = id;
        const t = threadOf(id);
        const starter = starterFor(id);
        if (!t.length && starter) {
          add(id, "as", starter, extraFor(id));
        }
        render();
        document.getElementById("prompt").focus();
      }

      function look(text) {
        const v = text.toLowerCase();
        if (/employee note|shift note/.test(v)) return "notes";
        if (/kitchen note|86 board/.test(v)) return "kitchen";
        if (/dining room|waitress|sidework|server checklist/.test(v)) return "dining";
        if (/\bdrivers?\b|driver note|hot and cold/.test(v)) return "driver";
        if (/\brecipe\b|\byield\b/.test(v)) return "recipes";
        if (/invoice|sysco|us foods/.test(v)) return "invoices";
        if (/order guide|par/.test(v)) return "guides";
        if (/punch|clock|timecard|stayed late/.test(v)) return known.schedule ? "report" : "schedules";
        if (/schedule|monday|am–pm|am-pm|posted/.test(v)) return "schedules";
        if (/labor card|front of house|dishwasher|back of house/.test(v)) return "cards";
        if (/labor report|headcount/.test(v)) return "report";
        if (/menu|burger|price|\$/.test(v) && room === "menu") return "menu";
        if (/void|net sales|end of day|end-of-day|close|z report/.test(v)) return "close";
        if (room !== "home") return room;
        return "close";
      }

      function reply(kind, text) {
        if (kind === "close") {
          known.close = true;
          return "Close is in. Sample shop: Downtown net $980,000 · voids $12,200 vs a 0.51% house median. Sales, promos, Void Hunter live on that file. SKU drift waits on menu + invoice. Not a food-cost %.";
        }
        if (kind === "menu") {
          known.menu = true;
          return "Got a plate and a price. That’s the menu. Recipe card is the plate — yield Missing, not a food-cost %. Order guide and invoice after this. We didn’t invent a save.";
        }
        if (kind === "schedules") {
          known.schedule = true;
          return "Schedule’s in. Sample week: 3 on the floor, 2 on the line, 1 dish, 1 run. That’s how this shop works — headcount by seat, not a textbook. Posted in / posted out is on the cards. Employee note is one line the shift can read. No names. Late drift needs the punch. Punches are Missing. We do not auto-write the week. No invented hours. No invented overtime.";
        }
        if (kind === "recipes") {
          return known.menu
            ? "Kept on the recipe card. Price stays on the menu. Yield stays Missing until you say it. Not a food-cost %."
            : "Menu first. Drop the plate and the price, then the recipe is honest. Yield stays Missing. Not a food-cost %.";
        }
        if (kind === "kitchen") {
          return known.schedule
            ? "Kept on the line. Open, mid, close — temps, 86 board, labels. No count invented. Not a food cost."
            : "Schedule first. Kitchen notes sit on the back-of-house seat. Drop the week, then the line.";
        }
        if (kind === "dining") {
          return known.schedule
            ? "Kept on the dining-room checklist. Open, shift, close. Allergy ask stays a question. No drawer totals."
            : "Schedule first. The dining-room checklist sits on the front-of-house seat. Drop the week, then the floor.";
        }
        if (kind === "driver") {
          return known.schedule
            ? "Kept on the driver notes. Bag check, hot and cold, receipt back. No guest address."
            : "Schedule first. Driver notes sit on the delivery seat. Drop the week, then the run.";
        }
        if (kind === "notes") {
          return known.schedule
            ? "Kept as the shift note. One line the floor can read. Not a write-up. No names."
            : "Schedule first. The employee note is one line for the shift that’s posted. No names.";
        }
        if (kind === "cards") {
          return "Labor cards spawned from the schedule. Each seat: posted in, posted out. Stay-late only if a punch says they stayed. Punch ≠ schedule. No labor $.";
        }
        if (kind === "report") {
          return known.punches
            ? "Punches would sit next to posted in / out. We still don’t invent a save."
            : "Labor report: sample headcount 3 floor / 2 line / 1 dish / 1 run. That’s the workflow. Late / stay-late is Missing — no punches. We will not say someone stayed late to make a story.";
        }
        if (POSITIONS[kind]) {
          return `${POSITIONS[kind].title}: ${POSITIONS[kind].posted} That’s the owner’s post, not the clock. Drift waits on a punch. No invented late.`;
        }
        if (kind === "guides") return STARTERS.guides;
        if (kind === "invoices") return STARTERS.invoices;
        return "Got it. Menu or the schedule — pick one. Labor comes off the schedule.";
      }

      function send(raw) {
        const text = (raw || document.getElementById("prompt").value || "").trim();
        if (!text) return;
        const kind = look(text);
        if (kind !== "close" && kind !== room && STARTERS[kind]) room = kind === "close" ? "home" : kind;
        const dest = room;
        add(dest, "me", text.replace(/</g, "&lt;"));
        add(dest, "as", reply(kind, text), extraFor(kind === "close" ? dest : kind));
        document.getElementById("prompt").value = "";
        document.getElementById("hint").textContent = "One more if you want. Or tap the left.";
        render();
      }

      document.body.addEventListener("click", (e) => {
        const t = e.target.closest("[data-room]");
        if (!t) return;
        if (t.classList.contains("new")) {
          threads.home = [];
          known.close = known.menu = known.schedule = known.punches = false;
        }
        openRoom(t.dataset.room);
      });
      document.getElementById("send").addEventListener("click", () => send());
      document.getElementById("prompt").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      document.getElementById("file").addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (!f) return;
        send("Dropped: " + f.name);
      });
      const box = document.getElementById("box");
      ["dragenter", "dragover"].forEach((ev) =>
        box.addEventListener(ev, (e) => {
          e.preventDefault();
          box.classList.add("hot");
        })
      );
      ["dragleave", "drop"].forEach((ev) =>
        box.addEventListener(ev, (e) => {
          e.preventDefault();
          box.classList.remove("hot");
        })
      );
      box.addEventListener("drop", (e) => {
        const name = (e.dataTransfer.files[0] && e.dataTransfer.files[0].name) || "drop.txt";
        send("Dropped: " + name);
      });
      render();
    </script>
  </body>
</html>
